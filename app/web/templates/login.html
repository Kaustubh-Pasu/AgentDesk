{% extends "base.html" %}
{% block title %}Sign in · Agent Desk{% endblock %}
{% block content %}
<h1>Owner sign in</h1>
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack narrow" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Email <input type="email" name="email" required maxlength="254" autocomplete="username"></label>
  <label>Password <input type="password" name="password" required maxlength="256" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<p class="muted">Public sign-up is disabled. The owner account is created with the one-time setup command.</p>
{% endblock %}
