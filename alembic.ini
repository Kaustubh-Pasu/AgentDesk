[alembic]
script_location = migrations
prepend_sys_path = .
# The URL is taken from DATABASE_URL in migrations/env.py; nothing secret lives in this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
