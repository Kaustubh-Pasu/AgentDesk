# Agent Desk — single-VPS production topology.   Validate:  docker compose -f deploy/docker-compose.yml config -q
#
#   internet ─► caddy (80/443) ─► desk ─┬─► controlplane (GoDaddy credential + ANS keys)   [control]
#                                       ├─► scraper (no secrets, no DB)                     [scrape]
#                                       └─► postgres / redis                                [data]
#
# Secret files live OUTSIDE the repository in ./secrets (git-ignored), one per service, so each container only ever
# receives what it needs:  secrets/desk.env  secrets/controlplane.env  secrets/postgres.env
name: agentdesk

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  pids_limit: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app-image: &app-image
  image: agentdesk:1.0.0
  build:
    context: ..
    dockerfile: Dockerfile

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN to the MLH domain you own}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    networks: [edge]
    depends_on:
      desk: { condition: service_healthy }

  desk:
    <<: [*hardening, *app-image]
    env_file: [../secrets/desk.env]            # SESSION_SECRET, CSRF_SECRET, DATABASE_URL (app role), REDIS_URL, CONTROLPLANE_TOKEN, optional LLM key
    environment:
      ENV: production
      SERVICE_ROLE: desk
      BASE_DOMAIN: ${BASE_DOMAIN}
      SCRAPER_URL: http://scraper:8000
      CONTROLPLANE_URL: http://controlplane:8000
      TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      GODADDY_API_BASE: ${GODADDY_API_BASE:-https://api.godaddy.com}
      ANS_TRUST_ANCHOR_PATH: ${ANS_TRUST_ANCHOR_PATH:-}
      ARTIFACTS_DIR: /artifacts
    volumes:
      - ../artifacts:/artifacts
    mem_limit: 768m
    cpus: 1.5
    networks: [edge, data, control, scrape]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz', headers={'Host': 'desk.${BASE_DOMAIN}'}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  controlplane:
    <<: [*hardening, *app-image]
    env_file: [../secrets/controlplane.env]    # GODADDY_PAT (or key/secret), CONTROLPLANE_TOKEN, DATABASE_URL (app role), SESSION_SECRET/CSRF_SECRET placeholders
    environment:
      ENV: production
      SERVICE_ROLE: controlplane
      BASE_DOMAIN: ${BASE_DOMAIN}
      GODADDY_API_BASE: ${GODADDY_API_BASE:-https://api.godaddy.com}
      KEYS_DIR: /keys
    volumes:
      - ans_keys:/keys                          # ANS private keys: mounted into THIS service only
    mem_limit: 384m
    cpus: 0.5
    networks: [control, data, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }

  scraper:
    <<: [*hardening, *app-image]
    environment:                                # deliberately NO env_file: the scraper receives no secret of any kind
      ENV: production
      SERVICE_ROLE: scraper
      BASE_DOMAIN: ${BASE_DOMAIN}
      SESSION_SECRET: scraper-has-no-sessions-placeholder-0000000000
      CSRF_SECRET: scraper-has-no-csrf-placeholder-11111111111111
    mem_limit: 384m
    cpus: 0.5
    networks: [scrape, scrape_egress]

  migrate:
    <<: [*hardening, *app-image]
    restart: "no"
    env_file: [../secrets/postgres.env]         # DATABASE_URL of the schema OWNER role (not given to the running app)
    environment: { ENV: development, BASE_DOMAIN: "${BASE_DOMAIN}" }
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    env_file: [../secrets/postgres.env]         # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / APP_DB_PASSWORD
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 6

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl",
              "--rename-command", "FLUSHALL", "", "--rename-command", "CONFIG", "", "--rename-command", "DEBUG", ""]
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 192m
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

networks:
  edge:                       # caddy ↔ desk, and desk's outbound path (ANS public API, verified remote agents)
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  data: { internal: true }    # postgres + redis: no route to the internet, never published
  control: { internal: true } # desk → controlplane only
  scrape: { internal: true }  # desk → scraper only
  egress:                     # controlplane → api.godaddy.com
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }
  scrape_egress:              # scraper → public websites ONLY (deploy/firewall.sh drops private/link-local/metadata)
    ipam: { config: [{ subnet: 172.30.3.0/24 }] }

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  ans_keys:
